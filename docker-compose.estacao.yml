# Estação no local do evento.
# Uso: docker compose --env-file .env.estacao -f docker-compose.estacao.yml up -d --build
name: fotos-estacao

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.lan.address=:80
    ports:
      - "${PORTA_LAN:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    env_file: .env.estacao
    volumes:
      - pg-estacao:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-estacao:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: db/Dockerfile }
    env_file: .env.estacao
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.estacao
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # Os envios dos fotógrafos chegam em /data/originais/_uploads: no mesmo volume dos
    # originais, o processamento só renomeia o arquivo, sem copiar.
    volumes:
      - originais:/data/originais
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`) || Path(`/test`)
      - traefik.http.routers.api.entrypoints=lan
      - traefik.http.services.api.loadbalancer.server.port=3000
    restart: unless-stopped

  # Tela do fotógrafo (/#/?t=...) e painel da estação (/#/estacao). Pega tudo que não é /api:
  # a regra da API é mais longa e o Traefik a prioriza.
  web:
    build: { context: ., dockerfile: apps/web-fotografo/Dockerfile }
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=lan
      - traefik.http.services.web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    # O worker não escuta HTTP: o healthcheck da imagem (GET /test) nunca passaria.
    healthcheck: { disable: true }
    env_file: .env.estacao
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - originais:/data/originais
      - publicar:/data/publicar
      - marcas:/data/marcas
    restart: unless-stopped

  vision:
    build:
      context: ./apps/vision-service
      target: final
      args:
        ORT: onnxruntime-gpu[cuda,cudnn]==1.30.0
    environment:
      VISION_MODO: gpu
      VISION_RAIZES: /data/originais
    volumes:
      - originais:/data/originais:ro
      - cache-tensorrt:/cache/tensorrt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pg-estacao:
  redis-estacao:
  originais:
  cache-tensorrt:
  publicar:
  marcas:
