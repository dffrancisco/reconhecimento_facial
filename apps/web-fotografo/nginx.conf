server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Página única com rotas em hash: qualquer caminho cai no index. O index nunca fica em
    # cache (é ele que aponta para o build novo); /assets/ tem hash no nome e pode ficar.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
