# Desenvolvimento: os dois papéis na mesma máquina.
# Só a infraestrutura:  docker compose -f docker-compose.dev.yml up -d postgres redis
# Tudo (sem GPU):       docker compose -f docker-compose.dev.yml up -d --build
# Com o vision na GPU:  docker compose -f docker-compose.dev.yml --profile gpu up -d --build
# Ingestão de teste:  docker compose -f docker-compose.dev.yml exec worker-estacao node dist/scripts/ingerir.js --evento <slug> --pasta /data/dados/<pasta>
#                     (a imagem é de produção: só tem dist/, sem tsx — por isso não é `npm run ingerir`)
name: fotos-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: fotos
      POSTGRES_PASSWORD: fotos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-dev:/var/lib/postgresql/data
      - ./infra/postgres/dev-bancos.sql:/docker-entrypoint-initdb.d/01-bancos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate-estacao:
    build: { context: ., dockerfile: db/Dockerfile }
    environment: &banco-dev
      POSTGRES_HOST: postgres
      POSTGRES_USER: fotos
      POSTGRES_PASSWORD: fotos
      PAPEL: estacao
      POSTGRES_DB: fotos_estacao
    depends_on:
      postgres: { condition: service_healthy }

  migrate-vps:
    build: { context: ., dockerfile: db/Dockerfile }
    environment:
      <<: *banco-dev
      PAPEL: vps
      POSTGRES_DB: fotos_vps
    depends_on:
      postgres: { condition: service_healthy }

  api-estacao:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *banco-dev
      REDIS_URL: redis://redis:6379
      REDIS_PREFIXO: "fotos:estacao:"
      ESTACAO_CHAVE: dev-somente-local-dev-somente-local
      VPS_URL: http://api-vps:3000
      VISION_URL: http://vision-gpu:8000
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      migrate-estacao: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api-vps:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *banco-dev
      PAPEL: vps
      POSTGRES_DB: fotos_vps
      REDIS_URL: redis://redis:6379
      REDIS_PREFIXO: "fotos:vps:"
      ESTACAO_CHAVE: dev-somente-local-dev-somente-local
      ARQUIVO_SEGREDO: dev-somente-local
      OPERADOR_SEGREDO: dev-somente-local-dev-somente-local
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      migrate-vps: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - selfies:/data/selfies
      - fotos-vps:/data/fotos
      - marcas-vps:/data/marcas

  worker-estacao:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    # O worker não escuta HTTP: o healthcheck da imagem (GET /test) nunca passaria.
    healthcheck: { disable: true }
    environment:
      <<: *banco-dev
      REDIS_URL: redis://redis:6379
      REDIS_PREFIXO: "fotos:estacao:"
      ESTACAO_CHAVE: dev-somente-local-dev-somente-local
      VPS_URL: http://api-vps:3000
      # Só resolve com --profile gpu (vision-gpu) no ar; sincronizar e sinal funcionam sem ele.
      VISION_URL: http://vision-gpu:8000
    volumes:
      - ./dados:/data/dados:ro
      - originais:/data/originais
      - publicar:/data/publicar
      - marcas-estacao:/data/marcas
    depends_on:
      migrate-estacao: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  arquivos:
    build: { context: ./infra/nginx }
    environment:
      ARQUIVO_SEGREDO: dev-somente-local
    volumes:
      - fotos-vps:/data/fotos:ro
      - zips-vps:/data/zips:ro
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      retries: 5

  vision-gpu:
    profiles: ["gpu"]
    build:
      context: ./apps/vision-service
      target: final
      args:
        ORT: onnxruntime-gpu[cuda,cudnn]==1.30.0
    environment:
      VISION_MODO: gpu
      # O pipeline manda o vision abrir o original gravado pelo worker: sem o volume
      # `originais` aqui, o /detect recusa a foto com "No such file or directory".
      VISION_RAIZES: /data/originais:/data/dados
    volumes:
      - ./dados:/data/dados:ro
      - originais:/data/originais:ro
    ports:
      - "127.0.0.1:8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vision-cpu:
    build:
      context: ./apps/vision-service
      target: final
    environment:
      VISION_MODO: selfie-cpu
      VISION_RAIZES: /data/selfies
    volumes:
      - selfies:/data/selfies
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  pg-dev:
  originais:
  publicar:
  marcas-estacao:
  fotos-vps:
  marcas-vps:
  zips-vps:
  # Selfies só existem durante a busca (spec §10): tmpfs, nunca em disco.
  selfies:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=1000"
