# Só em desenvolvimento (montado pelo docker-compose.dev.yml): em produção quem manda /api
# para a API é o Traefik. Sem isto, a tela servida em :8080 chamaria /api e receberia o
# index.html. O resolver adia a resolução do nome: o nginx sobe mesmo com a API parada.
location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api http://api-vps:3000;
    proxy_pass $api;
    # Até 3 selfies de 8 MB (o teto da API); o padrão do nginx é 1 MB.
    client_max_body_size 30m;
}
