# VPS sempre ligada.
# Uso: docker compose --env-file .env.vps -f docker-compose.vps.yml up -d --build
# Requer infra/certs/origem.pem e origem.key (certificado de origem da Cloudflare).
name: fotos-vps

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dinamico.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
    ports:
      - "${PORTA_HTTP:-80}:80"
      - "${PORTA_HTTPS:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/vps-dinamico.yml:/etc/traefik/dinamico.yml:ro
      - ./infra/certs:/certs:ro
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    env_file: .env.vps
    volumes:
      - pg-vps:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-vps:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: db/Dockerfile }
    env_file: .env.vps
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.vps
    environment:
      # Sai do domínio que o Traefik já usa: não há variável nova para preencher no .env.vps.
      ENDERECO_PARTICIPANTE: https://${DOMINIO_PARTICIPANTE}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=(Host(`${DOMINIO_PARTICIPANTE}`) || Host(`${DOMINIO_ADMIN}`)) && (PathPrefix(`/api`) || Path(`/test`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=3000
    restart: unless-stopped
    volumes:
      - selfies:/data/selfies
      - fotos:/data/fotos
      - marcas:/data/marcas
      - zips:/data/zips

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    # O worker não escuta HTTP: o healthcheck da imagem (GET /test) nunca passaria.
    healthcheck: { disable: true }
    env_file: .env.vps
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - fotos:/data/fotos:ro
      - zips:/data/zips
    restart: unless-stopped

  arquivos:
    build: { context: ., dockerfile: infra/nginx/Dockerfile }
    environment:
      ARQUIVO_SEGREDO: ${ARQUIVO_SEGREDO}
    volumes:
      - fotos:/data/fotos:ro
      - zips:/data/zips:ro
    labels:
      - traefik.enable=true
      # Tudo do domínio do participante que não é /api (regra mais longa, que o Traefik
      # prioriza): a tela e os /arquivos assinados.
      - traefik.http.routers.arquivos.rule=Host(`${DOMINIO_PARTICIPANTE}`)
      - traefik.http.routers.arquivos.entrypoints=websecure
      - traefik.http.routers.arquivos.tls=true
      - traefik.http.services.arquivos.loadbalancer.server.port=80
    restart: unless-stopped

  vision:
    build:
      context: ./apps/vision-service
      target: final
    environment:
      VISION_MODO: selfie-cpu
      VISION_RAIZES: /data/selfies
      SELFIE_CONCORRENCIA: ${SELFIE_CONCORRENCIA:-}
    volumes:
      - selfies:/data/selfies
    restart: unless-stopped

volumes:
  pg-vps:
  redis-vps:
  # Selfies só existem durante a busca (spec §10): tmpfs, nunca em disco.
  selfies:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=1000"
  fotos:
  marcas:
  zips:
